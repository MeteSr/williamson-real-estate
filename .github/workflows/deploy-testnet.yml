name: Deploy Testnet

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Install dfx
        run: |
          curl -fsSL "https://github.com/dfinity/sdk/releases/download/0.24.3/dfx-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz
          DFX_BIN=$(find . -name "dfx" -type f -perm /111 | head -1)
          sudo install -m 755 "$DFX_BIN" /usr/local/bin/dfx
          dfx --version

      - name: Set up dfx identity
        run: |
          echo "$DFX_IDENTITY_PEM" > /tmp/ci-deploy.pem
          dfx identity import --storage-mode plaintext ci-deploy /tmp/ci-deploy.pem
          rm /tmp/ci-deploy.pem
          dfx identity use ci-deploy
        env:
          DFX_IDENTITY_PEM: ${{ secrets.DFX_IDENTITY_PEM }}

      - name: Set cycles wallet
        run: dfx identity set-wallet "$WALLET_CANISTER_ID" --network testnet
        env:
          WALLET_CANISTER_ID: ${{ secrets.WALLET_CANISTER_ID }}
          DFX_WARNING: -mainnet_plaintext_identity

      - name: Deploy assets canister to testnet
        run: dfx deploy assets --network testnet --yes
        env:
          DFX_WARNING: -mainnet_plaintext_identity

      - name: Commit canister IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canister_ids.json
          if git diff --staged --quiet; then
            echo "canister IDs unchanged"
          else
            git commit -m "ops: update canister IDs after testnet deploy [skip ci]"
            git push
          fi
